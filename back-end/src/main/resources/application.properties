spring.application.name=backend

# Carrega secrets locais somente se o arquivo existir.
# Em produção, os valores vêm de variáveis de ambiente.
spring.config.import=optional:classpath:application-secrets.properties

spring.messages.basename=mesagens

# ==========================================
# BANCO DE DADOS
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeiro}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Railway injeta PORT automaticamente.
# Localmente continua usando 8080.
server.port=${PORT:8080}

# Necessário por estar atrás de proxy/reverse proxy em produção.
server.forward-headers-strategy=framework

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

# ==========================================
# E-MAIL
# ==========================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# GEMINI
# ==========================================

# Nunca coloque uma chave real aqui.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}