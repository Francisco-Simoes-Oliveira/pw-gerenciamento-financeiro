spring.application.name=back-end
server.port=8080

spring.datasource.url=jdbc:mariadb://localhost:3306/financeiro_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.security.jwt.secret=change-me-to-a-strong-base64-secret-change-me
app.security.jwt.issuer=financeiro-backend
app.security.jwt.expiration-minutes=120